# Production configuration is supplied by the platform. There are deliberately
# no development defaults: a missing value fails application startup.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are executed by the shared delivery pipeline before rollout.
spring.sql.init.mode=never

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db

# Logging
logging.level.org.springframework=INFO
logging.structured.format.console=logstash
logging.structured.json.add.service=petclinic

# One clear-text HTTP listener. TLS terminates at the platform ingress.
server.port=${PORT}
server.ssl.enabled=false

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
