name: Platform delivery handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Select the existing platform pipeline
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "Submit TARGET_SHA=$TARGET_SHA to the existing Jenkins petclinic job."
          echo "Jenkins packages and builds once; internal Git and Argo CD promote its digest."
          echo "This informational workflow does not build, migrate, or deploy the application."
