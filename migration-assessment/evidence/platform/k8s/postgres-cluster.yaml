apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: petclinic-db
  namespace: demo-app
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  bootstrap:
    initdb:
      database: petclinic
      owner: petclinic
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
